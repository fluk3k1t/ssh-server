[package]
name = "ssh-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa", "ecdsa-core"] }
futures = "0.3.32"
sha2 = "0.11.0"
aes = "0.9.0"
ctr = "0.10.0"
hmac-sha256 = "1.1.14"
