[package]
name = "ssh-server"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8"] }
bytes = "1.11.1"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1.18"
futures = "0.3.32"
p256 = { version = "0.13.2", features = ["ecdh"] }
sha2 = "0.11.0"
ssh-key = "0.6.7"
ssh-encoding = "0.2.0"
ctr = "0.10.0"
aes = "0.9.0"
cipher = { version = "0.5.1", features = ["stream-wrapper"] }
